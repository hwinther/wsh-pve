# NFS-Ganesha for the e2e tests: NFSv4 only (no rpcbind, mountd, NLM or rquota), one export.
NFS_CORE_PARAM {
    Protocols = 4;
    NFS_Port = 2049;
    Enable_NLM = false;
    Enable_RQUOTA = false;
}

NFSV4 {
    # a fresh server: no grace period to wait out before clients may open and lock files
    Graceless = true;
    RecoveryBackend = fs;
    # uid/gid as numbers: no idmapd domain to agree on, so files show as root, not nobody
    Allow_Numeric_Owners = true;
    Only_Numeric_Owners = true;
}

EXPORT {
    Export_Id = 1;
    Path = /export;
    Pseudo = /export;
    Protocols = 4;
    Transports = TCP;
    Access_Type = RW;
    Squash = No_Root_Squash;
    SecType = sys;
    FSAL {
        Name = VFS;
    }
}

LOG {
    Default_Log_Level = EVENT;
    # each NFSv4 operation and its status: the tests attach this log when the export fails their probe
    COMPONENTS {
        NFS4 = DEBUG;
    }
}
