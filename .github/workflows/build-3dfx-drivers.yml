name: Build and publish 3dfx/Mesa drivers

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      # the submodule gitlink changes when the pinned qemu-3dfx commit is bumped
      - "submodules/qemu-3dfx"
      # our change to its build (the guest CPU baseline) and the check of the result
      - "submodules/qemu-3dfx-drivers.patch"
      - "scripts/check-3dfx-drivers-isa.sh"
      # the Linux guest library (libglide.so.2), the demo and the release workflow itself
      - "scripts/build-3dfx-linux-glide.sh"
      - "e2e/3dfx/demo/**"
      # the demo's sound backends (shared with wshspace) and its -audiotest signal
      - "e2e/3dfx/audio/**"
      - "e2e/wisp/audiosig.h"
      - ".github/workflows/build-3dfx-drivers.yml"

permissions:
  # for pulling the djgpp-build image from ghcr.io
  packages: read
  # for creating releases
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.WORKFLOW_TOKEN }}
          fetch-depth: 0

      - name: Fix .gitmodules for CI
        run: sed -i -e 's|git@github.com:|https://github.com/|' .gitmodules

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build 3dfx/Mesa drivers
        run: |
          git submodule update --init submodules/qemu-3dfx
          QEMU3DFX_SHA=$(git -C submodules/qemu-3dfx rev-parse HEAD)
          QEMU3DFX_SHORT=$(git -C submodules/qemu-3dfx rev-parse --short=7 HEAD)
          echo "QEMU3DFX_SHA=$QEMU3DFX_SHA" >> $GITHUB_ENV
          echo "QEMU3DFX_SHORT=$QEMU3DFX_SHORT" >> $GITHUB_ENV

          sudo make 3dfx-drivers VERBOSE=2 DOCKER='docker' DOCKER_ARG='--user root'
          sudo chown -R "$(id -u):$(id -g)" build
          ls -la build/3dfx build/mesa

      # qemu-3dfx's Linux guest wrapper as libglide.so.2 for old i386 Linux guests (Glide 2.x),
      # i586 and glibc 2.0 symbol versions, both checked by scripts/build-3dfx-linux-glide.sh
      - name: Build the Linux guest Glide library
        run: |
          sudo make 3dfx-linux-glide DOCKER='docker' DOCKER_ARG='--user root'
          sudo chown -R "$(id -u):$(id -g)" build

      # wshdemo (e2e/3dfx/demo): Windows (Glide 2, Glide 3, OpenGL), DOS and Linux, each checked for
      # a Pentium by its build script
      - name: Build the demo
        run: |
          sudo make 3dfx-demo DOCKER='docker' DOCKER_ARG='--user root'
          sudo chown -R "$(id -u):$(id -g)" build

      - name: Package drivers
        run: |
          PKG="qemu-3dfx-drivers-${QEMU3DFX_SHORT}"
          mkdir -p "dist/${PKG}"

          # Collect exactly the guest-install set into one flat folder and fail
          # the build if the wrapper build silently dropped any artifact.
          missing=0
          for f in \
            build/3dfx/fxmemmap.vxd \
            build/3dfx/fxptl.sys \
            build/3dfx/glide.dll \
            build/3dfx/glide2x.dll \
            build/3dfx/glide2x.dxe \
            build/3dfx/glide2x.ovl \
            build/3dfx/glide3x.dll \
            build/3dfx/glide3x.dxe \
            build/3dfx/instdrv.exe \
            build/mesa/opengl32.dll \
            build/mesa/wglinfo.exe; do
            if [ -f "$f" ]; then
              cp "$f" "dist/${PKG}/"
            else
              echo "::error::missing 3dfx/Mesa artifact: $f"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || { echo "one or more driver artifacts were not built"; exit 1; }

          printf '%s\n' \
            "qemu-3dfx guest drivers" \
            "" \
            "submodule commit: ${QEMU3DFX_SHA}" \
            "revision (__REV__): ${QEMU3DFX_SHORT}-" \
            "built for i586 (-march=pentium, x87 math; no MMX, SSE or later)" \
            "opengl32.dll: a second context made while one is current gets the window's context" \
            "" \
            "These Windows 9x/2000/ME guest drivers must match the host qemu-system" \
            "binary built from the same qemu-3dfx commit. The pve-qemu-kvm package" \
            "built against this revision embeds the same __REV__ string, and the" \
            "wrapper refuses to load against a mismatched host binary." \
            > "dist/${PKG}/VERSION.txt"

          (cd dist && zip -r "${PKG}.zip" "${PKG}")
          ls -la "dist/${PKG}"

          # The Linux guest library as a tarball of its own (it keeps the libglide2x.so symlink)
          LPKG="qemu-3dfx-linux-glide-${QEMU3DFX_SHORT}"
          mkdir -p "dist/${LPKG}"
          for f in libglide.so.2 libglide2x.so README.txt; do
            [ -e "build/linux-glide/$f" ] || { echo "::error::missing Linux guest artifact: build/linux-glide/$f"; exit 1; }
          done
          cp -P build/linux-glide/libglide.so.2 build/linux-glide/libglide2x.so build/linux-glide/README.txt "dist/${LPKG}/"
          tar -C dist --owner=0 --group=0 -czf "dist/${LPKG}.tar.gz" "${LPKG}"
          tar -tvzf "dist/${LPKG}.tar.gz"

          # The demo: the Windows and DOS programs in a zip (README with CR LF), the Linux one in a tarball
          DPKG="wshdemo-${QEMU3DFX_SHORT}"
          for f in windows/WSHDEMO.EXE dos/WSHDEMO.EXE linux/wshdemo; do
            [ -s "build/wshdemo/$f" ] || { echo "::error::missing demo artifact: build/wshdemo/$f"; exit 1; }
          done
          mkdir -p "dist/${DPKG}/DOS"
          cp build/wshdemo/windows/WSHDEMO.EXE "dist/${DPKG}/"
          cp build/wshdemo/dos/WSHDEMO.EXE "dist/${DPKG}/DOS/"
          sed 's/$/\r/' e2e/3dfx/demo/README.txt > "dist/${DPKG}/README.TXT"
          (cd dist && zip -r "${DPKG}.zip" "${DPKG}")
          DLPKG="wshdemo-linux-${QEMU3DFX_SHORT}"
          mkdir -p "dist/${DLPKG}"
          cp build/wshdemo/linux/wshdemo e2e/3dfx/demo/README.txt "dist/${DLPKG}/"
          tar -C dist --owner=0 --group=0 -czf "dist/${DLPKG}.tar.gz" "${DLPKG}"
          unzip -l "dist/${DPKG}.zip"
          tar -tvzf "dist/${DLPKG}.tar.gz"

      - name: Create or update release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="qemu-3dfx-drivers-${QEMU3DFX_SHORT}"
          ZIP="dist/qemu-3dfx-drivers-${QEMU3DFX_SHORT}.zip"
          TGZ="dist/qemu-3dfx-linux-glide-${QEMU3DFX_SHORT}.tar.gz"
          DZIP="dist/wshdemo-${QEMU3DFX_SHORT}.zip"
          DTGZ="dist/wshdemo-linux-${QEMU3DFX_SHORT}.tar.gz"
          printf '%s\n' \
            "3dfx/Mesa passthrough guest drivers built from qemu-3dfx \`${QEMU3DFX_SHA}\`." \
            "" \
            "Install these in the Windows 9x/2000/ME guest to enable 3D acceleration with the" \
            "matching \`pve-qemu-kvm\` build. The guest driver revision \`${QEMU3DFX_SHORT}-\` must" \
            "match the host qemu binary, otherwise the wrapper will refuse to load." \
            "" \
            "Built for a Pentium-class guest CPU (i586, x87 math; no MMX, SSE or later, checked by" \
            "\`scripts/check-3dfx-drivers-isa.sh\`), so a \`cpu: pentium3\` guest runs them without KVM too." \
            "" \
            "\`qemu-3dfx-linux-glide-${QEMU3DFX_SHORT}.tar.gz\` is the Linux guest library (Glide 2.x only):" \
            "\`libglide.so.2\` and the \`libglide2x.so\` symlink for old i386 Linux guests (i586, glibc 2.0" \
            "or later), with a README on installing it. OpenGL and Glide 3 have no Linux guest wrapper." \
            "" \
            "\`wshdemo-${QEMU3DFX_SHORT}.zip\` and \`wshdemo-linux-${QEMU3DFX_SHORT}.tar.gz\` are wshdemo, a small" \
            "demo and test of the pass-through (a lit textured cube, a fogged tunnel, a plasma uploaded as a" \
            "texture every frame, a frame-rate graph): \`WSHDEMO.EXE\` for Windows (Glide 2, Glide 3 or" \
            "OpenGL), \`DOS/WSHDEMO.EXE\` (GLIDE2X.DXE) and \`wshdemo\` for i386 Linux (libglide.so.2)," \
            "with \`-bench N\` and \`-check\` modes; see its README." \
            > release-notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" "$TGZ" "$DZIP" "$DTGZ" --clobber
            gh release edit "$TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" \
              --title "3dfx/Mesa drivers (${QEMU3DFX_SHORT})" \
              --notes-file release-notes.md \
              "$ZIP" "$TGZ" "$DZIP" "$DTGZ"
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qemu-3dfx-drivers-${{ env.QEMU3DFX_SHORT }}
          path: |
            dist/*.zip
            dist/*.tar.gz
