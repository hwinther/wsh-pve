name: Updates master branch from upstream repository

on:
  workflow_dispatch:
    inputs:
      repository:
        description: "The repository to sync"
        required: true
        default: "hwinther/pve-manager"
        type: string
      build_deb:
        description: "Build debian package when changes are detected"
        required: false
        default: false
        type: boolean
      pr_assignee:
        description: "GitHub username to assign when deb build fails"
        required: false
        default: "hwinther"
        type: string
      track:
        description: "Move the submodule to the release in pve-no-subscription (released), the newer of pvetest and no-subscription (pvetest), or the tip of master"
        required: false
        default: "released"
        type: choice
        options:
          - released
          - pvetest
          - master
  workflow_call:
    inputs:
      repository:
        description: "The repository to sync"
        required: true
        default: "hwinther/pve-manager"
        type: string
      build_deb:
        description: "Build debian package when changes are detected"
        required: false
        default: true
        type: boolean
      pr_assignee:
        description: "GitHub username to assign when deb build fails"
        required: false
        default: "hwinther"
        type: string
      track:
        description: "released (the commit of the version in pve-no-subscription), pvetest (the newer of pvetest and no-subscription) or master (the branch tip)"
        required: false
        default: "released"
        type: string
    outputs:
      build-deb-when-changed-success:
        description: "Whether the build-deb-when-changed job succeeded"
        value: ${{ jobs.build-deb-when-changed.result == 'success' }}
      build-deb-failed:
        description: "Whether the build-deb-when-changed job failed"
        value: ${{ jobs.build-deb-when-changed.result == 'failure' }}
    secrets:
      WORKFLOW_TOKEN:
        description: "PAT for checkout and push (fork master branches, submodule bump on main) and the failure PR"
        required: false
      GPG_KEY:
        description: "Passed through to build-deb.yml for its repo-update.yml call"
        required: false
      GPG_PASSWORD:
        description: "Passed through to build-deb.yml for its repo-update.yml call"
        required: false

permissions: {}

jobs:
  sync-from-upstream:
    runs-on: ubuntu-latest
    # Checkout and push use WORKFLOW_TOKEN; GITHUB_TOKEN is not used.
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.repository }}
          ref: "master"
          token: ${{ secrets.WORKFLOW_TOKEN }}

      - run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"

          echo basename=$(basename ${{ inputs.repository }})
          upstream_repo=$(echo ${{ inputs.repository }} | sed -e "s/hwinther/proxmox/")

          if [ "${{ inputs.repository }}" == "hwinther/qemu-3dfx" ]; then
            upstream_repo="kjliew/qemu-3dfx"
          fi

          echo upstream_repo=$upstream_repo
          git remote add upstream https://github.com/$upstream_repo.git
          git fetch upstream

          git checkout master
          git rebase upstream/master
          git push --force-with-lease origin master

  update-submodule:
    runs-on: ubuntu-latest
    needs: [sync-from-upstream]
    # The qemu-3dfx pin is never moved here: it moves only through the promotion PR that
    # promote-qemu-3dfx.yml opens (with the port check and a 3dfx build). Its fork is still synced above.
    if: ${{ inputs.repository != 'hwinther/qemu-3dfx' }}
    # Checkout and push use WORKFLOW_TOKEN. GITHUB_TOKEN pulls the build image for the check and
    # opens, comments on or closes the "upstream sync held back" issue.
    permissions:
      contents: read
      packages: read
      issues: write
    outputs:
      changed: ${{ steps.update-submodule.outputs.changed }}
      submodule: ${{ steps.update-submodule.outputs.submodule }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.WORKFLOW_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Update submodule
        id: update-submodule
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ASSIGNEE: ${{ inputs.pr_assignee }}
          TRACK: ${{ inputs.track || 'released' }}
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"

          submodule=$(echo ${{ inputs.repository }} | sed -e 's|hwinther/||')
          echo submodule=$submodule
          echo "submodule=$submodule" >> $GITHUB_OUTPUT

          sed -i -e 's|git@github.com:|https://github.com/|' .gitmodules # switch from ssh to https because we don't have ssh keys in the pipeline
          if [ "$TRACK" = master ]; then
            git submodule update --init --remote submodules/$submodule
          else
            # Follow what Proxmox has published: the commit whose debian/changelog has the version in
            # pve-no-subscription (with track pvetest: the newer of pvetest and no-subscription), never
            # commits after it whose dependencies aren't released yet. A pvetest release can need
            # packages only pvetest has, and our build of it then doesn't install next to
            # no-subscription. Never moves the pointer backwards.
            if [ "$TRACK" = pvetest ]; then export PROXMOX_SUITES="pvetest pve-no-subscription"; fi
            git submodule update --init submodules/$submodule
            current=$(git -C submodules/$submodule rev-parse HEAD)
            if ! released=$(scripts/upstream-released-commit.sh "$submodule"); then
              echo "No published release found for $submodule; leaving it at $current"
            elif git -C submodules/$submodule merge-base --is-ancestor "$released" "$current"; then
              echo "$submodule is already at or past the published release ($released)"
              # A PR that refreshed the patch moved main past what this job held back. Nothing is
              # left to bump, so close the "held back" issue here; the close below only runs on a bump.
              title="Upstream sync held back: $submodule"
              issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" \
                --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -1)
              if [ -n "$issue" ]; then
                gh issue close "$issue" --repo "$GITHUB_REPOSITORY" \
                  --comment "main is at or past the published release (\`$(git -C submodules/$submodule rev-parse --short "$released")\`), so nothing is held back any more ($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
              fi
            else
              git -C submodules/$submodule checkout -q "$released"
            fi
          fi
          git checkout -- .gitmodules # revert the change to .gitmodules
          changelogChanges=$(git diff --submodule=diff | grep "debian/changelog" | wc -l)
          if [ $changelogChanges -eq 0 ]; then
            echo No changes in debian/changelog
            echo "changed=false" >> $GITHUB_OUTPUT
            echo -e "\n\nSubmodule diff:"
            git diff --submodule=diff
            exit 0
          fi

          git status
          if output=$(git status --porcelain) && [ -z "$output" ]; then
            # Working directory clean - do nothing
            echo Working directory clean
            echo "changed=false" >> $GITHUB_OUTPUT
            exit 0
          else
            # Uncommitted changes. Move main only if our patch still applies and the build
            # dependencies are met; otherwise keep main buildable and say why in one issue per
            # submodule (commented on once per upstream commit, closed when a later bump passes).
            title="Upstream sync held back: $submodule"
            issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" \
              --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -1)
            upstream_sha=$(git -C submodules/$submodule rev-parse --short HEAD)
            if ! REPORT="$RUNNER_TEMP/bump.md" scripts/check-upstream-bump.sh "$submodule"; then
              echo "::warning::$submodule upstream $upstream_sha held back, main not changed"
              cat "$RUNNER_TEMP/bump.md" >> "$GITHUB_STEP_SUMMARY"
              printf '\n%s\n' "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >> "$RUNNER_TEMP/bump.md"
              if [ -z "$issue" ]; then
                gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --assignee "$ASSIGNEE" \
                  --body-file "$RUNNER_TEMP/bump.md" || gh issue create --repo "$GITHUB_REPOSITORY" \
                  --title "$title" --body-file "$RUNNER_TEMP/bump.md"
              elif ! gh issue view "$issue" --repo "$GITHUB_REPOSITORY" --json body,comments \
                  --jq '.body, .comments[].body' | grep -qF "upstream \`$upstream_sha\`"; then
                gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/bump.md"
              fi
              echo "changed=false" >> $GITHUB_OUTPUT
              exit 0
            fi
            if [ -n "$issue" ]; then
              gh issue close "$issue" --repo "$GITHUB_REPOSITORY" \
                --comment "Upstream \`$upstream_sha\` passed the check and goes to main ($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
            fi

            echo Add and commit changes
            git add submodules/$submodule
            git commit -m "Update submodule $submodule"
            git pull --rebase origin main # final rebase before pushing in case another pipeline changed it recently
            git push origin main
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

  build-deb-when-changed:
    # build-deb.yml: GHCR push, GitHub release and (pve-qemu) the optional-extras issue; its
    # repo-update.yml call deploys GitHub Pages.
    permissions:
      contents: write
      packages: write
      issues: write
      pages: write
      id-token: write
    uses: ./.github/workflows/build-deb.yml
    needs: [update-submodule]
    if: ${{ needs.update-submodule.outputs.changed == 'true' && inputs.build_deb == true }}
    with:
      package: ${{ needs.update-submodule.outputs.submodule }}
    secrets:
      WORKFLOW_TOKEN: ${{ secrets.WORKFLOW_TOKEN }}
      GPG_KEY: ${{ secrets.GPG_KEY }}
      GPG_PASSWORD: ${{ secrets.GPG_PASSWORD }}

  create-pr-on-build-failure:
    runs-on: ubuntu-latest
    needs: [update-submodule, build-deb-when-changed]
    if: failure() && needs.build-deb-when-changed.result == 'failure'
    # The action checks out main, pushes the fix branch and opens the PR with WORKFLOW_TOKEN;
    # GITHUB_TOKEN only fetches this repo so the local action can be loaded.
    permissions:
      contents: read
    steps:
      - name: Checkout (for the local action)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create PR for manual fix
        uses: ./.github/actions/create-deb-failure-pr
        with:
          token: ${{ secrets.WORKFLOW_TOKEN }}
          packages: ${{ needs.update-submodule.outputs.submodule }}
          pr_assignee: ${{ inputs.pr_assignee }}
          run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          run_id: ${{ github.run_id }}
          workflow_context: sync-from-upstream
