name: wsh-qemu-rdp package

# The optional wsh-qemu-rdp package (packages/wsh-qemu-rdp): qemu-rdp, the RDP server of Marc-André
# Lureau's qemu-display, for the D-Bus display of a PVE VM (vga: display=dbus), with the unit
# wsh-qemu-rdp@<vmid>. Built from the pinned upstream commit (packages/wsh-qemu-rdp/upstream.env)
# with its crates from crates.io (cargo vendor), so it needs no changelog commit: its version comes
# from git (packages/wsh-qemu-rdp/version.sh, <qemu-rdp version>+git<date>.<sha7>.wsh<N>), and a
# commit that leaves the package alone builds the same version.
#
# Pull requests: build and lintian, then packages/wsh-qemu-rdp/test.sh in a clean Debian 13: the
# published pve-qemu-kvm runs wisp's framebuffer kernel (from the wisp-fb release) on x86 (AC97) and
# on the SS-5 (CS4231) with the D-Bus display, qemu-rdp serves it as the unit would, and FreeRDP on
# Xvfb checks the login, the picture against QEMU's screendump, the resize, keyboard, mouse and the
# rdpsnd sound. Nothing is published. main (or by hand on main): the same, then a GitHub release
# wsh-qemu-rdp-<version> with the .deb, tagged on the tip of main, unless one exists already, and
# the Pages deploy (repo-update.yml), which adds the newest wsh-qemu-rdp release's .deb to the apt
# repository.

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "packages/wsh-qemu-rdp/**"
      - ".github/workflows/wsh-qemu-rdp.yml"
  push:
    branches:
      - main
    paths:
      - "packages/wsh-qemu-rdp/**"
      - ".github/workflows/wsh-qemu-rdp.yml"

permissions: {}

# A newer push to a pull request replaces its running build; on main nothing is cancelled (a
# release job that is cut short would leave the version half-published).
concurrency:
  group: "${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # version.sh counts commits

      - name: Version
        id: version
        run: |
          set -euo pipefail
          eval "$(packages/wsh-qemu-rdp/version.sh)"
          echo "version=$WSH_QEMU_RDP_VERSION" | tee -a "$GITHUB_OUTPUT"

      - name: Build (and lintian)
        run: make wsh-qemu-rdp DOCKER=docker

      - name: Upload the package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wsh-qemu-rdp-deb
          path: build/wsh-qemu-rdp/wsh-qemu-rdp_*_amd64.deb
          if-no-files-found: error
          retention-days: 14

  test:
    name: Test (x86 and SS-5 guests through FreeRDP)
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wsh-qemu-rdp-deb
          path: ${{ runner.temp }}/deb

      # wisp's framebuffer kernels (e2e/wisp), from this repository's wisp-fb release
      - name: Download the guests
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/kernels"
          cd "$RUNNER_TEMP/kernels"
          gh release download wisp-fb --pattern SHA256SUMS --pattern kernel-fb-x86_64 --pattern kernel-fb-sparc32
          grep -E ' (kernel-fb-x86_64|kernel-fb-sparc32)$' SHA256SUMS | sha256sum -c

      - name: Serve the guests over RDP and check them
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          docker run --rm -v "$PWD:/src:ro" -v "$RUNNER_TEMP/deb:/deb:ro" -v "$RUNNER_TEMP/kernels:/kernels:ro" \
            -v "$RUNNER_TEMP/out:/out" debian:trixie sh /src/packages/wsh-qemu-rdp/test.sh \
            "/deb/wsh-qemu-rdp_${VERSION}_amd64.deb" /out

      # The container writes as root, some files 0600 (QEMU's screendumps): readable for the upload
      - name: Make the results readable
        if: ${{ always() }}
        run: sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/out"

      - name: Summary
        if: ${{ always() }}
        run: |
          if [ -f "$RUNNER_TEMP/out/summary.txt" ]; then
            { echo '## wsh-qemu-rdp test'; echo; echo '```'; cat "$RUNNER_TEMP/out/summary.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the logs, pictures and sound
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wsh-qemu-rdp-test
          path: ${{ runner.temp }}/out
          if-no-files-found: ignore
          retention-days: 14

  publish:
    name: Release
    needs: [build, test]
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # One publisher at a time: two pushes close together must not both create the same release.
    concurrency:
      group: wsh-qemu-rdp-publish
      cancel-in-progress: false
    permissions:
      contents: write # gh release create (GITHUB_TOKEN)
    outputs:
      published: ${{ steps.release.outputs.published }}
    steps:
      # main as it is now, which may have moved on since this run started: see the release step
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 0 # version.sh counts commits

      - name: Download the package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wsh-qemu-rdp-deb
          path: ${{ runner.temp }}/deb

      - name: Create the release (once per version)
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          # The tag as build-deb.yml forms it (the first + as -), and as generate-docs-packages.js expects
          tag="wsh-qemu-rdp-${VERSION/+/-}"
          deb="$RUNNER_TEMP/deb/wsh-qemu-rdp_${VERSION}_amd64.deb"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "::notice::$tag exists already: wsh-qemu-rdp $VERSION is published, nothing to do"
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The tag goes on this commit while it is the tip of main. GITHUB_TOKEN may not create a
          # tag on a commit whose workflow files differ from the default branch's (HTTP 403 without
          # the workflows permission), so when main has moved on, the tip is tagged if it builds the
          # same version (it left the package alone); otherwise the newer commit's own run
          # publishes its version.
          tip=$(git rev-parse HEAD)
          target="$COMMIT"
          if [ "$tip" != "$COMMIT" ]; then
            eval "$(packages/wsh-qemu-rdp/version.sh)"
            if [ "$WSH_QEMU_RDP_VERSION" != "$VERSION" ]; then
              echo "::notice::main has moved on to $tip (wsh-qemu-rdp $WSH_QEMU_RDP_VERSION): its own run publishes that, not $VERSION"
              echo "published=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::notice::main has moved on to $tip with the same wsh-qemu-rdp $VERSION: tagging the tip"
            target="$tip"
          fi
          upstream=$(sed -n 's/^QEMU_DISPLAY_COMMIT=//p' packages/wsh-qemu-rdp/upstream.env)
          printf '%s\n' "The optional wsh-qemu-rdp package (qemu-rdp from qemu-display $upstream, an RDP" \
            "server for the D-Bus display of PVE VMs), version $VERSION, built from $COMMIT. It reaches the" \
            "apt repository with the next Pages deploy." "" \
            "sha256: \`$(sha256sum "$deb" | cut -d ' ' -f 1)\`" > "$RUNNER_TEMP/notes.md"
          gh release create "$tag" --target "$target" --title "wsh-qemu-rdp v$VERSION" --latest=false \
            --notes-file "$RUNNER_TEMP/notes.md" "$deb"
          echo "published=true" >> "$GITHUB_OUTPUT"

  update-pages:
    name: Apt repository and Pages
    needs: [publish]
    if: ${{ needs.publish.outputs.published == 'true' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: $/.github/workflows/repo-update.yml
    secrets:
      GPG_KEY: ${{ secrets.GPG_KEY }}
      GPG_PASSWORD: ${{ secrets.GPG_PASSWORD }}
