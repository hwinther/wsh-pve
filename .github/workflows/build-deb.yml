name: Build debian package for submodule

on:
  workflow_dispatch:
    inputs:
      package:
        description: "The package to build"
        required: true
        default: "pve-manager"
        type: choice
        options:
          - pve-manager
          - pve-qemu
          - qemu-server
          - pve-storage
  workflow_call:
    inputs:
      package:
        description: "The package to build"
        required: true
        default: "pve-manager"
        type: string
    secrets:
      WORKFLOW_TOKEN:
        description: "PAT for checkout and the changelog push to main"
        required: false
      GPG_KEY:
        description: "Passed through to repo-update.yml"
        required: false
      GPG_PASSWORD:
        description: "Passed through to repo-update.yml"
        required: false

permissions: {}

jobs:
  # pve-qemu's 3dfx extra (qemu-system-x86_64-3dfx) compiles third-party code (qemu-3dfx's hw/3dfx and
  # hw/mesa), so it is built here, in a job with no WORKFLOW_TOKEN and no stored credentials, and the
  # build job below takes the binary from its artifact. Like everything optional it never fails the
  # build: whatever happens here, the build job runs, and without a binary it publishes without one.
  build-3dfx:
    name: Build the 3dfx extra
    if: inputs.package == 'pve-qemu'
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout (the build image on ghcr.io is public)
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # history for the Makefile's git log (the changelog entry of the 3dfx build). No ref: the
          # commit that started the run; the build job compares it with its own checkout.
          fetch-depth: 0

      - name: Build qemu-system-x86_64 with qemu-3dfx
        continue-on-error: true
        run: |
          set -o pipefail
          sudo make pve-qemu-3dfx VERBOSE=2 DOCKER='docker' DOCKER_ARG='--user root' 2>&1 \
            | tee "$RUNNER_TEMP/make-3dfx.log"

      # commit: what the build job compares its own checkout with; make.log: the first part of the
      # optional-extras report's build log (the "WARNING: optional extra 3dfx missing" line)
      - name: Collect the output
        if: ${{ !cancelled() }}
        run: |
          out="$RUNNER_TEMP/qemu-3dfx"
          mkdir -p "$out"
          git rev-parse HEAD > "$out/commit"
          cp "$RUNNER_TEMP/make-3dfx.log" "$out/make.log" || echo "(no log from the 3dfx build)" > "$out/make.log"
          if [ -s build/pve-qemu-3dfx/qemu-system-x86_64 ]; then
            cp build/pve-qemu-3dfx/qemu-system-x86_64 "$out/"
          fi
          ls -la "$out"

      - name: Upload the 3dfx build
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qemu-3dfx-pve-qemu
          path: ${{ runner.temp }}/qemu-3dfx/
          retention-days: 7

  build:
    needs: [build-3dfx]
    # build-3dfx is skipped for the other packages, and its failure must not stop pve-qemu
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # One build per package at a time. Two merges close together used to build the same package at
    # once: both read the same changelog, chose the same +wshN version and published different
    # content under it. A queued build starts when the one before it has pushed its changelog
    # commit, checks out the branch's tip (below) and so gets the next number. Of several queued
    # builds GitHub keeps the newest, which is the one that builds everything.
    concurrency:
      group: build-deb-${{ inputs.package }}
      cancel-in-progress: false
    permissions:
      # gh release create (GITHUB_TOKEN); the changelog push uses WORKFLOW_TOKEN
      contents: write
      # ghcr.io push (docker login with GITHUB_TOKEN)
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.WORKFLOW_TOKEN }}
          fetch-depth: 0

      # The tip of the branch when the job starts, not the commit that triggered the run: a build that
      # waited in the queue must see the changelog commit of the build before it. Done here rather
      # than with checkout's ref: an expression there makes poutine treat this workflow_call workflow
      # as checking out a fork's code (untrusted_checkout_exec); its callers run on push to main,
      # schedule and workflow_dispatch only, on this repository's own branches.
      - name: Move to the branch tip
        run: |
          case "$GITHUB_REF" in
            refs/heads/*) ;;
            *) echo "::error::build-deb.yml builds a branch, not $GITHUB_REF"; exit 1 ;;
          esac
          git fetch origin "+$GITHUB_REF:refs/remotes/origin/$GITHUB_REF_NAME"
          git checkout -B "$GITHUB_REF_NAME" --track "origin/$GITHUB_REF_NAME"
          git log -1 --format='Building %h: %s'

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download the 3dfx build
        if: inputs.package == 'pve-qemu'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: qemu-3dfx-pve-qemu
          path: ${{ runner.temp }}/qemu-3dfx

      # The binary goes where debian/rules of pve-qemu looks for it (build/pve-qemu-3dfx) if it was
      # built from the same 3dfx inputs as this checkout: a build that waited in the queue checks out a
      # newer tip than build-3dfx did, which is fine when only changelogs or other packages changed.
      # build-3dfx's log starts make.log, which the optional-extras report quotes.
      - name: Take the 3dfx build
        if: inputs.package == 'pve-qemu'
        run: |
          in="$RUNNER_TEMP/qemu-3dfx"
          if [ -f "$in/make.log" ]; then cp "$in/make.log" "$RUNNER_TEMP/make.log"; else : > "$RUNNER_TEMP/make.log"; fi
          reason=""
          built=$(cat "$in/commit" 2>/dev/null || true)
          if [ ! -s "$in/qemu-system-x86_64" ]; then
            # build-3dfx's log already has its "optional extra 3dfx missing" line
            [ -n "$built" ] || reason="the 3dfx build job left no output"
          elif ! git cat-file -e "${built}^{commit}" 2>/dev/null; then
            reason="the 3dfx build is of commit '$built', which this checkout doesn't have"
          elif ! git diff --quiet "$built" HEAD -- Makefile scripts/refresh-qemu-3dfx-patch.sh \
              submodules/pve-qemu submodules/pve-qemu.patch submodules/pve-qemu-qemu-3dfx.patch \
              submodules/qemu-3dfx submodules/qemu-3dfx.patch; then
            reason="the 3dfx build is of ${built:0:7}, whose pve-qemu or qemu-3dfx differs from this checkout's"
          else
            mkdir -p build/pve-qemu-3dfx
            install -m 0755 "$in/qemu-system-x86_64" build/pve-qemu-3dfx/qemu-system-x86_64
            echo "qemu-system-x86_64-3dfx from the 3dfx build of ${built:0:7}"
          fi
          if [ -n "$reason" ]; then
            # the first line is the start of the report's log excerpt for 3dfx
            printf '%s\n' "INFO: Building pve-qemu with 3dfx support: taking the build-3dfx job's binary" \
              "WARNING: optional extra 3dfx missing: $reason, pve-qemu ships without qemu-system-x86_64-3dfx" \
              | tee -a "$RUNNER_TEMP/make.log"
            echo "::warning title=optional extra 3dfx missing::$reason"
          fi

      - name: Build and push
        env:
          PACKAGE: ${{ inputs.package }}
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"

          sed -i -e 's|git@github.com:|https://github.com/|' .gitmodules # switch from ssh to https because we don't have ssh keys in the pipeline
          git submodule update --init submodules/${{ inputs.package }}

          if [ -f submodules/${{ inputs.package }}.changelog.patch ]; then
            pushd submodules/${{ inputs.package }}
            patch -p1 -u --no-backup-if-mismatch --reject-file=/dev/null -i ../${{ inputs.package }}.changelog.patch || rm ../${{ inputs.package }}.changelog.patch
            popd
          fi

          echo "::group::Add tag to submodule"
          GIT_SUBJECT=$(git log -1 --pretty=format:%s -- submodules/${{ inputs.package }}.patch)
          GIT_AUTHOR=$(git log -1 --pretty=format:%an -- submodules/${{ inputs.package }}.patch)
          GIT_EMAIL=$(git log -1 --pretty=format:%ae -- submodules/${{ inputs.package }}.patch)
          docker run --rm \
            -v .:/src \
            -w /src/submodules/${{ inputs.package }} \
            -e DEBEMAIL="$GIT_EMAIL" \
            -e DEBFULLNAME="$GIT_AUTHOR" \
            ghcr.io/hwinther/wsh-pve/pve-build:13 \
            dch -l +wsh -D trixie "$GIT_SUBJECT"
          echo -e "\n\n\n\n*********************************\n\nChangelog entries related to WSH:\n\n"
          grep -A4 "\+wsh" submodules/${{ inputs.package }}/debian/changelog
          echo -e "\n\n*********************************\n\n\n\n"
          WSH_VERSION=$(grep "\+wsh" submodules/${{ inputs.package }}/debian/changelog | head -1 | sed -E "s/^.*\(([0-9a-z\.\+\-]+)\).*$/\1/; s/\+/\-/")
          echo "WSH_VERSION=$WSH_VERSION"
          echo "WSH_VERSION=$WSH_VERSION" >> $GITHUB_ENV
          echo "::endgroup::"

          # Extract upstream Proxmox changelog entry (first non-+wsh)
          # Multiline for release notes, single-line for GHCR (max 512 chars)
          PROXMOX_CHANGELOG=$(awk '
            /^[a-zA-Z0-9][a-zA-Z0-9+.-]* \([0-9][0-9.]*\)/ && !/\+wsh/ { found=1 }
            found {
              block = block $0 "\n"
              if (/^ -- /) {
                print block
                exit
              }
            }
          ' submodules/${{ inputs.package }}/debian/changelog)
          [ -z "$PROXMOX_CHANGELOG" ] && PROXMOX_CHANGELOG="(upstream changelog not found)"
          echo "PROXMOX_CHANGELOG<<PROXMOX_END" >> $GITHUB_ENV
          echo "$PROXMOX_CHANGELOG" >> $GITHUB_ENV
          echo "PROXMOX_END" >> $GITHUB_ENV

          PROXMOX_CHANGELOG_ONELINE=$(echo "$PROXMOX_CHANGELOG" | tr '\n' ' ' | sed 's/  */ /g' | head -c 480)
          [ -z "$PROXMOX_CHANGELOG_ONELINE" ] && PROXMOX_CHANGELOG_ONELINE="(upstream changelog not found)"

          # For the 3dfx-enabled pve-qemu bundle, record the qemu-3dfx revision so users
          # can pair the host binary with the correct guest driver release.
          if [ "${{ inputs.package }}" = "pve-qemu" ]; then
            QEMU3DFX_SHA=$(git rev-parse HEAD:submodules/qemu-3dfx)
            QEMU3DFX_SHORT=${QEMU3DFX_SHA:0:7}
            QEMU3DFX_NOTE="Bundled with the 3dfx/Mesa passthrough patch from qemu-3dfx ${QEMU3DFX_SHORT}. For 3D acceleration in Windows 9x/2000/ME guests, install the matching drivers from the qemu-3dfx-drivers-${QEMU3DFX_SHORT} release; the guest driver revision must match the host binary."
            echo "QEMU3DFX_NOTE<<Q3DFX_END" >> $GITHUB_ENV
            echo "$QEMU3DFX_NOTE" >> $GITHUB_ENV
            echo "Q3DFX_END" >> $GITHUB_ENV
            PROXMOX_CHANGELOG_ONELINE=$(echo "${PROXMOX_CHANGELOG_ONELINE} | ${QEMU3DFX_NOTE}" | head -c 480)
          fi

          tag_wsh_version=ghcr.io/hwinther/wsh-pve/${{ inputs.package }}:$WSH_VERSION
          tag_latest=ghcr.io/hwinther/wsh-pve/${{ inputs.package }}:latest

          # The log is also the build log excerpt of the optional-extras report (pve-qemu). For
          # pve-qemu these are pve-qemu-bundle's targets except pve-qemu-3dfx, which build-3dfx ran
          # (its binary is in build/pve-qemu-3dfx, its log at the start of make.log).
          set -o pipefail
          MAKE_TARGETS="$PACKAGE"
          if [ "$PACKAGE" = pve-qemu ]; then MAKE_TARGETS="restore-sparc openbios-sparc32 pve-qemu"; fi
          # shellcheck disable=SC2086 # one word per target
          sudo make $MAKE_TARGETS VERBOSE=2 DOCKER='docker' DOCKER_ARG='--user root' 2>&1 \
            | tee -a "$RUNNER_TEMP/make.log"
          set +o pipefail

          ls -la build/*
          buildPath=$(realpath build)
          echo "Building and pushing with org.opencontainers.image.description from upstream changelog"
          podman build . -f submodules/${{ inputs.package }}.Dockerfile -v $buildPath:/build \
            --build-arg "IMAGE_DESCRIPTION=Proxmox upstream: $PROXMOX_CHANGELOG_ONELINE" \
            -t $tag_wsh_version -t $tag_latest
          podman push $tag_wsh_version
          podman push $tag_latest

          git pull
          pushd submodules/${{ inputs.package }}
          git diff -p -U10 debian/changelog > ../${{ inputs.package }}.changelog.patch
          popd
          git add submodules/${{ inputs.package }}.changelog.patch
          git commit -m "Update changelog for ${{ inputs.package }} ($WSH_VERSION)"
          # When one change touches two packages, their jobs push a changelog commit to main at
          # about the same time and the later push is rejected. The commits touch different files,
          # so put this one on top of the new main and try again.
          for attempt in 1 2 3 4 5; do
            if git push origin; then
              break
            fi
            if [ "$attempt" = 5 ]; then
              echo "::error::The changelog push was rejected 5 times"
              exit 1
            fi
            sleep $((attempt * 5))
            git pull --rebase --autostash
          done

      # pve-qemu's optional extras (3dfx, openbios, openbios-sparc64, sun-proms) never fail the build, so a package
      # without one is published like any other. This says which ones it has (job summary and a
      # warning); the report-optional-extras job keeps an issue open for each missing one.
      - name: Check the optional extras
        id: extras
        if: inputs.package == 'pve-qemu'
        continue-on-error: true
        env:
          # The Sun PROMs come from a private repository (submodules/sparc) that only this
          # repository's WORKFLOW_TOKEN can read: a fork builds without them.
          EXPECT: ${{ github.repository == 'hwinther/wsh-pve' && '3dfx,openbios,openbios-sparc64,sun-proms' || '3dfx,openbios,openbios-sparc64' }}
        run: |
          out="$RUNNER_TEMP/optional-extras"
          mkdir -p "$out"
          deb=$(find build/repo -name 'pve-qemu-kvm_*.deb' -type f | head -n 1)
          rc=0
          scripts/check-qemu-extras.sh --deb "$deb" --built build/openbios --stock submodules/pve-qemu/qemu/pc-bios \
            --expect "$EXPECT" --result "$out/result.tsv" --markdown > "$out/summary.md" || rc=$?
          tee -a "$GITHUB_STEP_SUMMARY" < "$out/summary.md"
          dpkg-deb -f "$deb" Version > "$out/version"
          cp "$RUNNER_TEMP/make.log" "$out/make.log"
          missing=$(awk -F '\t' '$2 == "missing" { printf "%s%s", sep, $1; sep = "," }' "$out/result.tsv")
          echo "missing=$missing" >> "$GITHUB_OUTPUT"
          if [ "$rc" -ne 0 ]; then
            echo "::warning title=pve-qemu-kvm without optional extras::missing: ${missing:-see the check}; the package is published anyway"
          fi

      - name: Upload the optional extras check
        if: inputs.package == 'pve-qemu'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: optional-extras-pve-qemu
          path: ${{ runner.temp }}/optional-extras/
          if-no-files-found: ignore
          retention-days: 7

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WSH_VERSION: ${{ env.WSH_VERSION }}
          PROXMOX_CHANGELOG: ${{ env.PROXMOX_CHANGELOG }}
          QEMU3DFX_NOTE: ${{ env.QEMU3DFX_NOTE }}
          EXTRAS_MISSING: ${{ steps.extras.outputs.missing }}
        run: |
          case ",$EXTRAS_MISSING," in
            *,3dfx,*) QEMU3DFX_NOTE="This build has no 3dfx/Mesa pass-through: qemu-system-x86_64-3dfx failed to build, and VMs with 3DFX/Mesa enabled don't start." ;;
          esac

          DEB_FILE=$(find build/repo -name "*.deb" -type f)
          if [ -z "$DEB_FILE" ]; then
            echo "No .deb file found in build/repo"
            exit 1
          fi

          RELEASE_TAG="${{ inputs.package }}-${WSH_VERSION/+/-}"
          echo "Creating release with tag: $RELEASE_TAG"

          RELEASE_NOTES="Release of ${{ inputs.package }} version $WSH_VERSION"
          if [ -n "$PROXMOX_CHANGELOG" ] && [ "$PROXMOX_CHANGELOG" != "(upstream changelog not found)" ]; then
            RELEASE_NOTES="${RELEASE_NOTES}

          ## Upstream Proxmox changelog

          ${PROXMOX_CHANGELOG}"
          fi

          if [ -n "$QEMU3DFX_NOTE" ]; then
            RELEASE_NOTES="${RELEASE_NOTES}

          ## 3dfx / Mesa drivers

          ${QEMU3DFX_NOTE}"
          fi

          if [ -n "$EXTRAS_MISSING" ]; then
            RELEASE_NOTES="${RELEASE_NOTES}

          ## Optional extras missing

          Built without: ${EXTRAS_MISSING//,/, } (see the issues titled \"pve-qemu-kvm built without the optional extra\")."
          fi

          gh release create "$RELEASE_TAG" \
            --title "${{ inputs.package }} v$WSH_VERSION" \
            --notes "$RELEASE_NOTES" \
            "$DEB_FILE"

      - name: Upload build folder
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-${{ inputs.package }}
          path: build/

  # One issue per optional extra the pve-qemu package was built without (scripts/report-qemu-extras.sh):
  # opened, or updated once per version while it stays missing, and closed by the first build that has
  # it again. GITHUB_TOKEN with issues: write in this job only. Never fails the run (the package is
  # published either way), and not for forks, whose builds have no business opening issues here.
  report-optional-extras:
    name: Report missing optional extras
    needs: [build]
    if: ${{ inputs.package == 'pve-qemu' && needs.build.result == 'success' && github.repository == 'hwinther/wsh-pve' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read # checkout, for scripts/report-qemu-extras.sh
      issues: write # open, comment on and close the issues (GITHUB_TOKEN)
    steps:
      - name: Checkout (for the script)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the optional extras check
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: optional-extras-pve-qemu
          path: ${{ runner.temp }}/optional-extras

      - name: Open, update or close the issues
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ASSIGNEE: ${{ github.repository_owner }}
        run: |
          dir="$RUNNER_TEMP/optional-extras"
          scripts/report-qemu-extras.sh --result "$dir/result.tsv" --log "$dir/make.log" --version "$(cat "$dir/version")" \
            --commit "$COMMIT" --run-url "$RUN_URL" --assignee "$ASSIGNEE"

  update-docs-after-changes:
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/repo-update.yml
    needs: [build]
    if: ${{ github.event_name == 'workflow_dispatch' && needs.build.result == 'success' }}
    secrets:
      GPG_KEY: ${{ secrets.GPG_KEY }}
      GPG_PASSWORD: ${{ secrets.GPG_PASSWORD }}
