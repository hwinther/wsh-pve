name: E2E

# Boots a single-node PVE in a container with the WSH packages (e2e/pve/Dockerfile) and runs the
# Playwright suite in e2e/ against it: VM configs created through the API and the web UI, the QEMU
# command qemu-server builds from them (`qm showcmd`), and whether QEMU accepts that command.
#
# The image installs the packages published at debian.wshosting.no, so this checks what users get.

on:
  workflow_dispatch:
  # Every pull request, without a paths filter, so the required e2e-required check always reports;
  # the changes job skips the image build and the suite when the PR touches none of their paths.
  pull_request:
    branches:
      - main
  # Also on main: a PR can only restore caches from its own branch and from main, so without a run
  # on main every new PR starts with cold node_modules and Playwright browser caches.
  push:
    branches:
      - main
    paths:
      - "e2e/**"
      - "submodules/*.patch"
      - "scripts/check-qemu-extras.sh"
      - ".github/workflows/e2e.yml"

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}"
  cancel-in-progress: true

jobs:
  # Whether this PR touches the image or the suite (changed); the packages the boot test starts, or
  # the boot test itself (boot); and which of the boot job's builds it needs besides qemu-server:
  # pve-manager (manager) and QEMU (qemu). All always true on push and dispatch.
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      changed: ${{ steps.changed.outputs.changed }}
      boot: ${{ steps.boot.outputs.changed }}
      manager: ${{ steps.manager.outputs.changed }}
      qemu: ${{ steps.qemu.outputs.changed }}
    steps:
      - name: Changed files
        id: changed
        uses: hwinther/reusable-workflows/.github/actions/changed-files@9c35353ba10990931ef9a24642ff1d0ecf0b82f8 # v2.42.0
        with:
          patterns: |
            ^e2e/
            ^submodules/[^/]+\.patch$
            ^scripts/check-qemu-extras\.sh$
            ^\.github/workflows/e2e\.yml$

      - name: Changed files (boot)
        id: boot
        uses: hwinther/reusable-workflows/.github/actions/changed-files@9c35353ba10990931ef9a24642ff1d0ecf0b82f8 # v2.42.0
        with:
          patterns: |
            ^submodules/qemu-server\.patch$
            ^submodules/qemu-server$
            ^submodules/pve-manager\.patch$
            ^submodules/pve-manager$
            ^submodules/pve-qemu\.patch$
            ^submodules/pve-qemu$
            ^e2e/pve/
            ^\.github/workflows/e2e\.yml$

      - name: Changed files (boot, pve-manager)
        id: manager
        uses: hwinther/reusable-workflows/.github/actions/changed-files@9c35353ba10990931ef9a24642ff1d0ecf0b82f8 # v2.42.0
        with:
          patterns: |
            ^submodules/pve-manager\.patch$
            ^submodules/pve-manager$

      - name: Changed files (boot, QEMU)
        id: qemu
        uses: hwinther/reusable-workflows/.github/actions/changed-files@9c35353ba10990931ef9a24642ff1d0ecf0b82f8 # v2.42.0
        with:
          patterns: |
            ^submodules/pve-qemu\.patch$
            ^submodules/pve-qemu$
            ^e2e/pve/build-qemu\.sh$

  build:
    needs: [changes]
    if: ${{ needs.changes.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the PVE image
        run: |
          DOCKER_BUILDKIT=1 docker build -f e2e/pve/Dockerfile -t wsh-pve-e2e:ci .
          docker run --rm --entrypoint dpkg-query wsh-pve-e2e:ci -W pve-manager qemu-server pve-qemu-kvm libpve-storage-perl | tee -a "$GITHUB_STEP_SUMMARY"
          docker save wsh-pve-e2e:ci | gzip -1 > pve-e2e-image.tar.gz

      - name: Upload the image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pve-e2e-image
          path: pve-e2e-image.tar.gz
          retention-days: 3

  e2e:
    needs: [changes, build]
    if: ${{ needs.changes.outputs.changed == 'true' }}
    permissions:
      contents: read
      packages: read
      pull-requests: write
      # The reusable workflow asks for `actions: read` (gh run download of the image artifact); a
      # caller has to grant at least what the called job asks for.
      actions: read
    uses: hwinther/reusable-workflows/.github/workflows/playwright-e2e.yml@523b5580b380c07200a565f13aae350565418277 # v2.24.0
    with:
      compose_file: e2e/docker-compose.e2e.yml
      playwright_working_directory: e2e
      playwright_cache_enabled: true
      node_modules_cache_enabled: true
      # setup-node's registry-url defaults to GitHub Packages; the e2e deps are public npm.
      npm_registry_url: https://registry.npmjs.org
      compose_up_timeout_seconds: 300
      image_artifacts_json: |
        {"PVE_IMAGE":"pve-e2e-image"}
      # Before the suite: the Glide guest of tests/3dfx-gl-display.spec.ts into the running PVE
      # container (3dfx/pve-guest-setup.sh: Debian's kernel and the guest built there with apt, about
      # a minute; PVE_GUEST_FETCH fetches the public qemu-3dfx submodule, which the checkout lacks).
      # A failed setup doesn't stop the suite: E2E_3DFX_GUEST=required makes that one spec fail.
      playwright_run_command: >-
        { PVE_GUEST_FETCH=1 sh 3dfx/pve-guest-setup.sh wsh-pve-e2e ||
        echo "::warning title=3dfx guest::pve-guest-setup.sh failed: 3dfx-gl-display.spec.ts will fail"; } &&
        npx playwright test
      # The tests also exec into the container (qm showcmd, /etc/pve) via the runner's Docker socket.
      playwright_env: |
        PVE_URL=https://localhost:8006
        E2E_3DFX_GUEST=required

  # A real boot through PVE with the pull request's packages (e2e/README.md, "Booting a guest
  # through PVE"): the suite only checks that QEMU accepts the command, and the start-up bugs fixed
  # in #248 passed that. Builds qemu-server from submodules/qemu-server.patch (always) and
  # pve-manager from pve-manager.patch (when that changes), installs them over the published
  # packages (PACKAGES=mixed), and when the pve-qemu build changes copies qemu-system-x86_64 and
  # -aarch64 built from the pull request's tree over the published ones (e2e/pve/build-qemu.sh).
  # Then e2e/pve/boot-test.sh creates VMs through the API and starts an Alpine virt CD with
  # qm start on x86_64 (i440fx, q35, q35 with OVMF; KVM when the runner has it) and aarch64 (virt,
  # AAVMF, TCG) until the serial console shows the login prompt. Pull requests and dispatch only:
  # on main, build-deb.yml builds and publishes the packages itself.
  boot:
    needs: [changes]
    if: ${{ needs.changes.outputs.boot == 'true' && github.event_name != 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      CONTAINER: wsh-pve-boot
      IMAGE: wsh-pve-e2e:boot
      BUILD_MANAGER: ${{ needs.changes.outputs.manager }}
      BUILD_QEMU: ${{ needs.changes.outputs.qemu }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The test media (pinned in e2e/pve/boot-media.sh) come from the Actions cache, which only
      # main fills (here on dispatch, and daily in media-cache.yml): a pull request restores main's
      # entry and never saves its own copy (e2e/README.md, "Downloaded media in the Actions cache")
      - name: Cache key of the ISOs
        id: iso-key
        run: echo "key=$(sh e2e/pve/boot-media.sh key)" >> "$GITHUB_OUTPUT"

      - name: Restore the ISOs
        id: iso-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/iso
          key: ${{ steps.iso-key.outputs.key }}

      - name: Download and check the ISOs
        run: sh e2e/pve/boot-media.sh fetch "$RUNNER_TEMP/iso"

      - name: Save the ISOs (main only)
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.iso-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/iso
          key: ${{ steps.iso-key.outputs.key }}

      - name: Build the pull request's packages
        run: |
          # https instead of ssh: no ssh keys here (as in build-deb.yml)
          sed -i -e 's|git@github.com:|https://github.com/|' .gitmodules
          git submodule update --init submodules/qemu-server
          if [ "$BUILD_MANAGER" = true ]; then git submodule update --init submodules/pve-manager; fi
          git checkout -- .gitmodules
          sudo make qemu-server VERBOSE=2 DOCKER=docker DOCKER_ARG='--user root'
          cp build/repo/qemu-server_*.deb e2e/pve/debs/
          if [ "$BUILD_MANAGER" = true ]; then
            # without pve-manager's own tests (build-deb.yml runs them): this job is about starting guests
            sudo make pve-manager VERBOSE=2 DOCKER=docker DOCKER_ARG='--user root' DEB_BUILD_OPTIONS=nocheck
            cp build/repo/pve-manager_*.deb e2e/pve/debs/
          fi
          ls -l e2e/pve/debs/

      - name: Build the PVE image with them
        run: |
          DOCKER_BUILDKIT=1 docker build -f e2e/pve/Dockerfile --build-arg PACKAGES=mixed -t "$IMAGE" .
          # The image must carry each package just built, not the published one
          for deb in e2e/pve/debs/*.deb; do
            pkg=$(dpkg-deb -f "$deb" Package)
            want=$(dpkg-deb -f "$deb" Version)
            have=$(docker run --rm --entrypoint dpkg-query "$IMAGE" -W -f '${Version}' "$pkg")
            if [ "$have" != "$want" ]; then
              echo "::error::the image has $pkg $have, not the one just built ($want)"
              exit 1
            fi
          done

      # No workflow builds the pve-qemu-kvm package on a pull request: the two binaries the boot test
      # starts, from the tree dpkg-source would build (pve-qemu at the pull request's pin with
      # pve-qemu.patch and debian/patches), over the published package's
      - name: Build QEMU from this pull request
        if: ${{ env.BUILD_QEMU == 'true' }}
        run: |
          sed -i -e 's|git@github.com:|https://github.com/|' .gitmodules
          git submodule update --init submodules/pve-qemu
          git checkout -- .gitmodules
          patch -d submodules/pve-qemu -p1 -s -i ../pve-qemu.patch
          git -C submodules/pve-qemu submodule update --init qemu
          mkdir -p build/boot-qemu
          docker run --rm --entrypoint sh -e JOBS="$(nproc)" -v "$PWD:/src" "$IMAGE" \
            /src/e2e/pve/build-qemu.sh /src/submodules/pve-qemu /src/build/boot-qemu
          printf 'FROM %s\nCOPY qemu-system-x86_64 qemu-system-aarch64 /usr/bin/\n' "$IMAGE" \
            | docker build -t "$IMAGE" -f - build/boot-qemu
          docker run --rm --entrypoint qemu-system-x86_64 "$IMAGE" --version | grep 'pve-qemu-kvm_boot-test'

      - name: Packages under test
        run: |
          {
            echo '| Package | Version | From |'
            echo '|---|---|---|'
            for pkg in qemu-server pve-manager pve-qemu-kvm pve-edk2-firmware-ovmf pve-edk2-firmware-aarch64; do
              ver=$(docker run --rm --entrypoint dpkg-query "$IMAGE" -W -f '${Version}' "$pkg")
              from=published
              if ls e2e/pve/debs/"${pkg}"_*.deb >/dev/null 2>&1; then from='this pull request'; fi
              if [ "$pkg" = pve-qemu-kvm ] && [ "$BUILD_QEMU" = true ]; then
                from='published, with qemu-system-x86_64 and -aarch64 from this pull request'
              fi
              echo "| $pkg | $ver | $from |"
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Start the PVE node
        run: |
          # privileged with systemd as PID 1, like e2e/docker-compose.e2e.yml
          docker run -d --name "$CONTAINER" --hostname pve --privileged --tmpfs /run --tmpfs /run/lock \
            -v "$RUNNER_TEMP/iso:/var/lib/vz/template/iso:ro" "$IMAGE"
          for _ in $(seq 1 60); do
            if docker exec "$CONTAINER" test -f /run/pve-e2e-ready; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::the PVE node did not come up"
          docker logs "$CONTAINER" 2>&1 | tail -n 50
          exit 1

      # Every case runs; a failed one fails the step at the end
      - name: Boot Alpine through PVE
        run: |
          printf '\n| Case | Result | Reached |\n|---|---|---|\n' >> "$GITHUB_STEP_SUMMARY"
          failed=""
          # case, VM ID, ISO, timeout (s)
          while read -r case vmid iso timeout; do
            out="$RUNNER_TEMP/boot-$case.txt"
            if docker exec -i "$CONTAINER" sh -s -- "$case" "$vmid" "local:iso/$iso" "$timeout" \
              < e2e/pve/boot-test.sh > "$out" 2>&1; then
              result=$(sed -n "s/^$case: //p" "$out")
            else
              failed="$failed $case"
              result="failed: $(sed -n '0,/^::error::/s/^::error:://p' "$out")"
            fi
            cat "$out"
            echo "| $case | $result | $(sed -n 's/^seen: //p' "$out" | paste -sd, -) |" >> "$GITHUB_STEP_SUMMARY"
          done <<'CASES'
          i440fx 9001 alpine-virt-x86_64.iso 300
          q35 9002 alpine-virt-x86_64.iso 300
          ovmf 9003 alpine-virt-x86_64.iso 300
          aarch64 9004 alpine-virt-aarch64.iso 600
          CASES
          if [ -n "$failed" ]; then
            echo "::error::no login prompt through PVE for:$failed"
            exit 1
          fi

      - name: Keep the serial logs
        if: ${{ failure() }}
        run: |
          mkdir -p "$RUNNER_TEMP/boot-logs"
          cp "$RUNNER_TEMP"/boot-*.txt "$RUNNER_TEMP/boot-logs/" 2>/dev/null || true
          docker cp "$CONTAINER:/tmp/." "$RUNNER_TEMP/boot-logs/" || true
          docker exec "$CONTAINER" journalctl --no-pager -n 300 > "$RUNNER_TEMP/boot-logs/journal.txt" 2>&1 || true

      - name: Upload the serial logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: boot-logs
          path: ${{ runner.temp }}/boot-logs
          retention-days: 7
          if-no-files-found: ignore

  # Pushes to main publish the e2e results as the signed OCI artifact
  # ghcr.io/hwinther/wsh-pve/quality:main and the quality-summary workflow artifact: the devops
  # report reads it, and pages-after-e2e.yml turns it into the e2e badge on debian.wshosting.no.
  quality:
    needs: [e2e]
    if: ${{ !cancelled() && github.event_name == 'push' }}
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: hwinther/reusable-workflows/.github/workflows/quality-artifact.yml@d323062b90d0cb8e76889bc1762db348d90d5d08 # v2.41.3
    with:
      tags: |
        main-${{ github.sha }}
        main

  # The required check (devops rulesets/e2e-required.json). Runs on every PR: passes when the e2e
  # and boot jobs passed or were skipped because nothing relevant changed, fails when one failed or
  # was cancelled.
  e2e-required:
    name: e2e-required
    if: ${{ always() }}
    needs: [changes, build, e2e, boot]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check the e2e jobs' results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$RESULTS" | jq -e 'any(.[]; .result == "failure" or .result == "cancelled")' > /dev/null; then
            echo "::error::A job on the way to the e2e run, or the boot test, failed or was cancelled."
            exit 1
          fi
