name: Sync pve-storage from upstream

on:
  workflow_dispatch:
  schedule:
    - cron: "45 20 * * *"

permissions: {}

jobs:
  sync:
    # A caller has to grant at least what the called jobs ask for: sync-from-upstream.yml calls
    # build-deb.yml (GHCR push, GitHub release, the pve-qemu optional-extras issue), which calls
    # repo-update.yml (GitHub Pages deploy).
    permissions:
      contents: write
      packages: write
      issues: write
      pages: write
      id-token: write
    uses: ./.github/workflows/sync-from-upstream.yml
    with:
      repository: hwinther/pve-storage
    secrets:
      WORKFLOW_TOKEN: ${{ secrets.WORKFLOW_TOKEN }}
      GPG_KEY: ${{ secrets.GPG_KEY }}
      GPG_PASSWORD: ${{ secrets.GPG_PASSWORD }}

  update-docs:
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/repo-update.yml
    needs: [sync]
    if: needs.sync.outputs.build-deb-when-changed-success == 'true'
    secrets:
      GPG_KEY: ${{ secrets.GPG_KEY }}
      GPG_PASSWORD: ${{ secrets.GPG_PASSWORD }}
