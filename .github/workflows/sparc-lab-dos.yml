name: sparc lab DOS

# The lab's x86 retro machinery without Microsoft media: the VGA text reader and the DOS parsers
# (e2e/sparc/tests/test_vgatext.py, test_dos.py, standard library only), then FreeDOS 1.4 installed
# from its seven floppies under the published pve-qemu-kvm (TCG), driven on the VGA text screen with
# the disk swaps, booted from the disk and checked (tests/test_freedos.py). The FreeDOS zip is
# downloaded by the test and checked against its pinned sha256; nothing from the lab host is used.

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "e2e/sparc/**"
      - ".github/workflows/sparc-lab-dos.yml"

permissions: {}

concurrency:
  group: "${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}"
  cancel-in-progress: true

jobs:
  dos:
    name: FreeDOS from floppies
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Unit tests (VGA text reader, DOS catalogue and parsers)
        working-directory: e2e/sparc
        run: python3 -m unittest -v tests/test_vgatext.py tests/test_dos.py tests/test_targets.py

      - name: Build the lab image
        run: docker build -f e2e/sparc/Dockerfile -t wsh-sparc-lab .

      - name: Install FreeDOS from floppies in the lab
        run: |
          mkdir -p "$RUNNER_TEMP/freedos"
          docker run --rm -v "$RUNNER_TEMP/freedos:/out" -e FREEDOS_OUT=/out -e WSH_LAB_GUEST_TESTS=1 \
            --entrypoint python3 wsh-sparc-lab -m unittest -v tests/test_freedos.py

      - name: Keep the evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: freedos-evidence
          path: |
            ${{ runner.temp }}/freedos
            !${{ runner.temp }}/freedos/**/*.raw
            !${{ runner.temp }}/freedos/**/*.sock
          retention-days: 7
