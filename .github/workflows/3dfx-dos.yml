name: 3dfx in DOS

# The qemu-3dfx Glide pass-through from DOS (e2e/3dfx/dos-test.sh), with free software only: FreeDOS
# 1.4's boot floppy (the Floppy Edition, from the Actions cache, saved by main only, and checked against
# its pin by e2e/sparc/fetch_media.py and the harness), FreeDOS's CWSDPMI, HIMEMX and JEMM386 from the same floppies, our DJGPP test program
# (e2e/3dfx/dos/glidedos.c, built in the DJGPP image) and qemu-3dfx's DOS wrapper GLIDE2X.DXE from
# the qemu-3dfx-drivers release the published binary names. The published pve-qemu-kvm's
# qemu-system-x86_64-3dfx boots it headless, as PVE runs a `vga: std,mesa=1` VM, once per memory
# profile (no memory manager, HIMEMX, HIMEMX and JEMM386); the program draws the test scene, reads
# it back and checks it, and the harness checks the frame in QEMU's screendump of the console and
# that DOS's text screen comes back afterwards. Last in each boot, wshspace -audiotest and wshdemo
# -audiotest play the audio signature (e2e/wisp/audiosig.h) through their Sound Blaster backend
# (e2e/3dfx/audio) on QEMU's sb16, recorded with `-audiodev wav` and checked by e2e/audio/wavcheck.py.
#
# Not a required check, so the paths filter is fine. Weekly as well, to notice a package update or a
# new qemu-3dfx pin that breaks the DOS wrapper.

on:
  workflow_dispatch:
  schedule:
    - cron: "47 5 * * 0"
  pull_request:
    branches:
      - main
    paths:
      - "e2e/3dfx/**"
      - "e2e/wisp/audiosig.h"
      - "e2e/audio/wavcheck.py"
      - "e2e/sparc/targets_dos.py"
      - "e2e/sparc/fetch_media.py"
      - "packages/wsh-openglide/tests/scene.h"
      - "scripts/check-3dfx-drivers-isa.sh"
      - "submodules/qemu-3dfx"
      - "submodules/qemu-3dfx-drivers.patch"
      - ".github/workflows/3dfx-dos.yml"

permissions: {}

concurrency:
  group: "${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}"
  cancel-in-progress: true

jobs:
  dos:
    name: Glide from FreeDOS (GLIDE2X.DXE)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # checkout, gh release download of the guest drivers
      packages: read # docker pull of the DJGPP image from ghcr.io
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The qemu-3dfx submodule (the DXE import library's source)
        run: git submodule update --init --depth 1 submodules/qemu-3dfx

      # The FreeDOS zip comes from the Actions cache, which only main fills (here on the schedule and
      # on dispatch, and daily in media-cache.yml): a pull request restores main's entry and never
      # saves its own copy (e2e/README.md, "Downloaded media in the Actions cache"). fetch_media.py
      # checks the restored zip against its pin (e2e/sparc/targets_dos.py, FREEDOS_ZIP) and downloads
      # it only when it is missing or not the pinned one; the same key and path as sparc-lab-dos.yml,
      # audio-matrix.yml and media-cache.yml's freedos job (one entry for the three)
      - name: FreeDOS cache key
        id: freedos-key
        run: echo "key=$(python3 e2e/sparc/fetch_media.py --key FD14-FloppyEdition.zip)" >> "$GITHUB_OUTPUT"

      - name: Restore the FreeDOS zip
        id: freedos-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/freedos
          key: ${{ steps.freedos-key.outputs.key }}

      - name: Download and check the FreeDOS zip
        run: python3 e2e/sparc/fetch_media.py "$RUNNER_TEMP/freedos" FD14-FloppyEdition.zip

      - name: Save the FreeDOS zip (main only)
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.freedos-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/freedos
          key: ${{ steps.freedos-key.outputs.key }}

      - name: Login to GitHub Container Registry (the DJGPP image)
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: FreeDOS, GLIDEDOS.EXE, GLIDE2X.DXE and wshspace -audiotest in the published qemu-system-x86_64-3dfx
        env:
          GH_TOKEN: ${{ github.token }} # gh release download of the qemu-3dfx-drivers release
        run: |
          mkdir -p "$RUNNER_TEMP/dos"
          rc=0
          e2e/3dfx/dos-test.sh --out "$RUNNER_TEMP/dos" --image "wsh-3dfx-dos:gh-${GITHUB_RUN_ID}" \
            --freedos-zip "$RUNNER_TEMP/freedos/FD14-FloppyEdition.zip" || rc=$?
          if [ "$rc" = 77 ]; then
            echo "::notice title=3dfx in DOS not tested::the published pve-qemu-kvm has no qemu-system-x86_64-3dfx, or it can't show Glide headless"
            exit 0
          fi
          exit "$rc"

      - name: Summary
        if: ${{ !cancelled() }}
        run: cat "$RUNNER_TEMP/dos/summary.md" >> "$GITHUB_STEP_SUMMARY" || echo "no summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the logs and screendumps
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: 3dfx-dos
          path: |
            ${{ runner.temp }}/dos
            !${{ runner.temp }}/dos/.freedos-cache
            !${{ runner.temp }}/dos/release
            !${{ runner.temp }}/dos/**/*.sock
            !${{ runner.temp }}/dos/**/*.img
            !${{ runner.temp }}/dos/**/*.wav
          retention-days: 14
          if-no-files-found: warn
