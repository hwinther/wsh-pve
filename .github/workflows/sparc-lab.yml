name: sparc lab

# Boots sparc guests under the published qemu-system-sparc (e2e/sparc) and runs a fixed list of
# cases from e2e/sparc/matrix.py: installed Solaris disks and install CDs, each case on a fresh copy.
#
# Runs on a self-hosted runner that has the media, which a public repo must not hand to pull requests:
# manual and weekly runs only, never pull_request or push. The runner needs Docker and three host
# directories (inputs below; the schedule uses the defaults): the install CDs and the installed
# disk images, both mounted read only, and a directory for run output; for benchdisk and smp also the bench
# disk (e2e/sparc/README.md, "The bench disk"), whose directory is mounted read only.

on:
  workflow_dispatch:
    inputs:
      matrix:
        description: "Case list from e2e/sparc/matrix.py (pve, install: e2e/sparc/pve_matrix.py)"
        type: choice
        options:
          - smoke
          - machines
          - display
          - idle
          - bench
          - pve
          - install
          - display-x
          - sparc64
          - benchdisk
          - smp
          - stopa
          - solaris10
          - solaris10-install
        default: smoke
      iso_dir:
        description: "Install CDs on the runner host (mounted read only)"
        default: /mnt/os/iso
      disks_dir:
        description: "Installed disk images on the runner host (mounted read only, copied per case)"
        default: /mnt/os/disks
      runs_dir:
        description: "Run output on the runner host (a per-run subdirectory, removed afterwards)"
        default: /mnt/runs
      publish_media:
        description: "When every case passed, replace the docs' recordings in the media release with this run's (e2e/sparc/publish_media.py)"
        type: boolean
        default: false
      bench_disk:
        description: "The bench disk on the runner host (benchdisk; its directory is mounted read only)"
        default: /mnt/os/disks/bench-sol26.raw
  schedule:
    - cron: "17 3 * * 0"
    - cron: "47 4 * * 0" # the pve matrix

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}"
  cancel-in-progress: false

jobs:
  matrix:
    runs-on: [self-hosted, Linux, X64, sparc-lab]
    timeout-minutes: 240
    permissions:
      contents: read
    env:
      MATRIX: ${{ inputs.matrix || (github.event.schedule == '47 4 * * 0' && 'pve') || 'smoke' }}
      ISO_DIR: ${{ inputs.iso_dir || '/mnt/os/iso' }}
      DISKS_DIR: ${{ inputs.disks_dir || '/mnt/os/disks' }}
      RUN_DIR: ${{ inputs.runs_dir || '/mnt/runs' }}/gh-${{ github.run_id }}-${{ github.run_attempt }}
      BENCH_DISK: ${{ inputs.bench_disk || '/mnt/os/disks/bench-sol26.raw' }}
      FLOPPY_DIR: /mnt/os/floppy
      IMAGE: wsh-sparc-lab:gh-${{ github.run_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the lab image
        if: ${{ env.MATRIX != 'pve' && env.MATRIX != 'install' }}
        run: |
          # --no-cache: the point is the newest published pve-qemu-kvm, not a cached apt layer
          docker build --pull --no-cache -f e2e/sparc/Dockerfile -t "$IMAGE" .
          docker run --rm --entrypoint dpkg-query "$IMAGE" -W pve-qemu-kvm | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Run the ${{ env.MATRIX }} matrix
        if: ${{ env.MATRIX != 'pve' && env.MATRIX != 'install' }}
        run: |
          # The bench disk's directory, only when it exists (docker would create a missing one);
          # without it the benchdisk cases fail with "bench disk ... doesn't exist"
          bench=()
          if [ -f "$BENCH_DISK" ]; then
            bench=(-v "$(dirname "$BENCH_DISK"):$(dirname "$BENCH_DISK"):ro")
          fi
          # The Solaris 10 install takes ~80 min, more than matrix.py's 3600 s per case
          timeout=()
          if [ "$MATRIX" = solaris10-install ]; then
            timeout=(--timeout 9000)
          fi
          docker run --rm --name "sparc-lab-${GITHUB_RUN_ID}" \
            -v "$ISO_DIR:$ISO_DIR:ro" -v "$DISKS_DIR:$DISKS_DIR:ro" -v "$RUN_DIR:$RUN_DIR" "${bench[@]}" \
            --entrypoint python3 "$IMAGE" matrix.py "$MATRIX" --runs "$RUN_DIR" --iso "$ISO_DIR" --disks "$DISKS_DIR" \
            --bench "$BENCH_DISK" "${timeout[@]}"

      # pve, install: VMs created through the API of a PVE node in a container (the e2e image with the
      # lab in it), started by PVE and driven by the lab in attach mode (e2e/sparc/pve_matrix.py);
      # install runs `lab.py install --check` for every automated install target (targets.py)
      - name: Build the PVE node with the lab
        if: ${{ env.MATRIX == 'pve' || env.MATRIX == 'install' }}
        run: |
          # --no-cache: the newest published qemu-server and pve-qemu-kvm
          docker build --pull --no-cache -f e2e/pve/Dockerfile -t "$IMAGE-pve" .
          docker build -f e2e/sparc/pve.Dockerfile --build-arg PVE_IMAGE="$IMAGE-pve" -t "$IMAGE" e2e/sparc
          docker run --rm --entrypoint dpkg-query "$IMAGE" -W qemu-server pve-qemu-kvm | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Run the ${{ env.MATRIX }} matrix on the PVE node
        if: ${{ env.MATRIX == 'pve' || env.MATRIX == 'install' }}
        run: |
          # The bench disk's directory, only when it exists (the sol26-ss20-smp2 case imports it)
          bench=()
          if [ -f "$BENCH_DISK" ]; then
            bench=(-v "$(dirname "$BENCH_DISK"):$(dirname "$BENCH_DISK"):ro")
          fi
          # The install floppies (the DOS targets), only when the directory exists
          if [ -d "$FLOPPY_DIR" ]; then
            bench+=(-v "$FLOPPY_DIR:$FLOPPY_DIR:ro")
          fi
          # privileged with systemd as PID 1, like e2e/docker-compose.e2e.yml
          docker run -d --name "sparc-lab-${GITHUB_RUN_ID}" --hostname pve --privileged \
            --tmpfs /run --tmpfs /run/lock \
            -v "$ISO_DIR:$ISO_DIR:ro" -v "$DISKS_DIR:$DISKS_DIR:ro" -v "$RUN_DIR:$RUN_DIR" "${bench[@]}" "$IMAGE"
          for _ in $(seq 1 60); do
            docker exec "sparc-lab-${GITHUB_RUN_ID}" test -f /run/pve-e2e-ready && break
            sleep 5
          done
          docker exec "sparc-lab-${GITHUB_RUN_ID}" python3 pve_matrix.py "$MATRIX" \
            --runs "$RUN_DIR" --iso "$ISO_DIR" --disks "$DISKS_DIR" --bench "$BENCH_DISK" --floppy "$FLOPPY_DIR"

      - name: Summary
        if: ${{ !cancelled() }}
        run: cat "$RUN_DIR/summary.md" >> "$GITHUB_STEP_SUMMARY" || echo "no summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Make the results readable
        if: ${{ !cancelled() }}
        # The containers write the run directory as root, and the PVE node writes some files 0600.
        run: docker run --rm -v "$RUN_DIR:/r" --entrypoint chmod "$IMAGE" -R a+rX /r || true

      - name: Upload the results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sparc-lab-${{ env.MATRIX }}
          # matrix.py deletes the disk copies; the exclusions keep a killed run's leftovers out too.
          # The recordings (serial.cast, serial.fast.cast, fb.webm, fb.vtt) are evidence and go along.
          path: |
            ${{ env.RUN_DIR }}
            !${{ env.RUN_DIR }}/**/disk.raw*
            !${{ env.RUN_DIR }}/**/*.sock
            !${{ env.RUN_DIR }}/**/_frames/**
          retention-days: 14
          if-no-files-found: warn

      - name: Clean up
        if: ${{ always() }}
        run: |
          docker rm -f "sparc-lab-${GITHUB_RUN_ID}" 2>/dev/null || true
          # The run directory belongs to root (the container wrote it), so remove it from a container.
          docker run --rm -v "$(dirname "$RUN_DIR"):/runs" --entrypoint rm "$IMAGE" -rf "/runs/$(basename "$RUN_DIR")" || true
          docker image rm "$IMAGE" || true
          docker image rm "$IMAGE-pve" 2>/dev/null || true

  # Opt-in (publish_media, manual runs only): the curated recordings of a run in which every case
  # passed replace those assets of the `media` release; the docs site copies the release into
  # /recordings/ on its next deploy (repo-update.yml). Off the self-hosted runner: it only needs the
  # artifact and a token that may write release assets.
  media:
    needs: [matrix]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_media }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # release assets
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sparc-lab-${{ inputs.matrix }}
          path: ${{ runner.temp }}/runs

      - name: Upload the curated recordings to the media release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python3 e2e/sparc/publish_media.py "$RUNNER_TEMP/runs" "$RUNNER_TEMP/media" | tee -a "$GITHUB_STEP_SUMMARY"
          if compgen -G "$RUNNER_TEMP/media/*" > /dev/null; then
            gh release upload media "$RUNNER_TEMP"/media/* -R "$REPO" --clobber
          fi
