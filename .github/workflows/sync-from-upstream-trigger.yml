name: Updates master branches of local repos from upstream

# Starts each sync-*.yml on main at once, the same runs their nightly schedules start. The dispatch
# uses GITHUB_TOKEN with actions: write: a workflow_dispatch made with GITHUB_TOKEN starts a run
# (unlike a push made with it), and the sync runs then push and build with their own WORKFLOW_TOKEN,
# so they need nothing from the token that started them.
#
# From any ref other than main, or with dry_run, it only checks that each workflow exists and says
# what it would start: the syncs always run on main and push there.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only list the sync workflows it would start (always on for a ref other than main)"
        required: false
        default: false
        type: boolean

permissions: {}

jobs:
  trigger:
    name: Trigger ${{ matrix.workflow }}
    runs-on: ubuntu-latest
    permissions:
      actions: write # gh workflow run (GITHUB_TOKEN)
    strategy:
      fail-fast: false
      matrix:
        workflow:
          - sync-pve-manager.yml
          - sync-qemu-server.yml
          - sync-pve-storage.yml
          - sync-qemu-3dfx.yml
          - sync-pve-qemu.yml
    steps:
      - name: Trigger ${{ matrix.workflow }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WORKFLOW: ${{ matrix.workflow }}
          DRY_RUN: ${{ inputs.dry_run || github.ref != 'refs/heads/main' }}
        run: |
          gh workflow view "$WORKFLOW" --ref main > /dev/null
          if [ "$DRY_RUN" = true ]; then
            echo "Dry run (ref $GITHUB_REF): would run 'gh workflow run $WORKFLOW --ref main'" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            gh workflow run "$WORKFLOW" --ref main
            echo "Started $WORKFLOW on main" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
