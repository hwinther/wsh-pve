name: x86 audio matrix

# Which sound devices of the published pve-qemu-kvm make sound in which guest, and whether the
# published qemu-server's `audio0:` wires them up (e2e/audio/audio_matrix.py): a FreeDOS boot floppy
# (from the Floppy Edition zip in the Actions cache, which main saves and pull requests restore)
# running our own AUDTEST.COM (SB16, AdLib, PC speaker, GUS, CS4231A) and a Debian kernel + initramfs playing a tone
# with aplay (AC97, ES1370, Intel HDA, virtio-sound, USB audio), recorded with QEMU's `wav` backend
# and checked for the expected tones. Directly on QEMU and through qemu-server (`audio0: driver=wav`:
# `qm showcmd`, then a real `qm start`) on the e2e PVE node. Every recording's wav header is checked
# too (format, whole frames, sizes right or 0), and QEMU is ended mid-playback by QMP quit, SIGTERM,
# SIGKILL and `qm stop`. The results table goes to the job summary; the wav files and logs are the
# artifact.
#
# Not a required check, so the paths filter is fine. Weekly as well, to notice a package update that
# breaks a device.

on:
  workflow_dispatch:
  schedule:
    - cron: "37 5 * * 0"
  pull_request:
    branches:
      - main
    paths:
      - "e2e/audio/**"
      - "e2e/wisp/audiosig.h"
      - "e2e/3dfx/space/**"
      - "e2e/3dfx/demo/**"
      - "e2e/3dfx/audio/**"
      - "scripts/build-3dfx-linux-glide.sh"
      - "e2e/sparc/targets_dos.py"
      - "e2e/sparc/fetch_media.py"
      - "e2e/pve/**"
      - ".github/workflows/audio-matrix.yml"

permissions: {}

concurrency:
  group: "${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}"
  cancel-in-progress: true

jobs:
  matrix:
    name: Audio devices x guests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      # (the runner context isn't available at job level)
      RUN_DIR: /tmp/audio-matrix
      NAME: audio-matrix-${{ github.run_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Unit tests (wav analysis)
        working-directory: e2e/audio
        run: python3 -m unittest -v test_wavcheck.py

      # The FreeDOS zip comes from the Actions cache, which only main fills (here on the schedule and on dispatch, and daily in
      # media-cache.yml): a pull request restores main's entry and never saves its own copy
      # (e2e/README.md, "Downloaded media in the Actions cache"). fetch_media.py checks the restored zip
      # against its pin (e2e/sparc/targets_dos.py, FREEDOS_ZIP) and downloads it only when it is
      # missing or not the pinned one; the same key and path as 3dfx-dos.yml,
      # sparc-lab-dos.yml and media-cache.yml's freedos job (one entry for the three)
      - name: FreeDOS cache key
        id: freedos-key
        run: echo "key=$(python3 e2e/sparc/fetch_media.py --key FD14-FloppyEdition.zip)" >> "$GITHUB_OUTPUT"

      - name: Restore the FreeDOS zip
        id: freedos-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/freedos
          key: ${{ steps.freedos-key.outputs.key }}

      - name: Download and check the FreeDOS zip
        run: python3 e2e/sparc/fetch_media.py "$RUNNER_TEMP/freedos" FD14-FloppyEdition.zip

      - name: Save the FreeDOS zip (main only)
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.freedos-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/freedos
          key: ${{ steps.freedos-key.outputs.key }}

      - name: Build the images (published packages)
        run: |
          docker build -f e2e/pve/Dockerfile -t wsh-pve-e2e:audio .
          docker build -f e2e/audio/Dockerfile --build-arg PVE_IMAGE=wsh-pve-e2e:audio -t wsh-audio .
          docker run --rm --entrypoint sh wsh-audio -c \
            'dpkg-query -W pve-qemu-kvm qemu-server pve-manager; cat /audio/guests/versions.txt'

      - name: Start the PVE node
        run: |
          mkdir -p "$RUN_DIR"
          # privileged with systemd as PID 1, like e2e/docker-compose.e2e.yml; /dev/kvm (when the
          # runner has it) comes with --privileged and speeds up the Linux guests
          docker run -d --name "$NAME" --hostname pve --privileged --tmpfs /run --tmpfs /run/lock \
            -v "$RUN_DIR:/runs" -v "$RUNNER_TEMP/freedos:/freedos:ro" wsh-audio
          for _ in $(seq 1 60); do
            docker exec "$NAME" test -f /run/pve-e2e-ready && break
            sleep 5
          done
          docker exec "$NAME" test -f /run/pve-e2e-ready

      - name: Run the matrix
        run: docker exec -e FREEDOS_ZIP=/freedos/FD14-FloppyEdition.zip "$NAME" python3 audio_matrix.py all --out /runs

      - name: Summary
        if: ${{ !cancelled() }}
        run: cat "$RUN_DIR/summary.md" >> "$GITHUB_STEP_SUMMARY" || echo "no summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Make the results readable
        if: ${{ !cancelled() }}
        run: docker exec "$NAME" chmod -R a+rX /runs || true

      - name: Upload the results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: audio-matrix
          path: |
            ${{ env.RUN_DIR }}
            !${{ env.RUN_DIR }}/*.img
          retention-days: 14
          if-no-files-found: warn

      - name: Clean up
        if: ${{ always() }}
        run: docker rm -f "$NAME" || true

  # wshspace -audiotest and wshdemo -audiotest (e2e/3dfx/space/audio-test.sh): the audio signature
  # (e2e/wisp/audiosig.h) twice, through the OSS /dev/dsp backend the two programs share
  # (e2e/3dfx/audio) in a Linux guest with AC97, recorded by the published pve-qemu-kvm's wav backend
  # and checked by wavcheck.py; wshdemo's build also runs its music test (e2e/3dfx/demo/music-test.c).
  # The DOS builds' Sound Blaster backend is checked in 3dfx-dos.yml.
  wshspace:
    name: wshspace and wshdemo -audiotest (Linux, OSS, AC97)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The qemu-3dfx submodule (the Linux guest Glide library wshspace and wshdemo link)
        run: git submodule update --init --depth 1 submodules/qemu-3dfx

      - name: wshspace and wshdemo -audiotest in a Linux guest
        run: |
          mkdir -p "$RUNNER_TEMP/wshspace"
          devices=()
          [ ! -e /dev/kvm ] || devices=(--device /dev/kvm)
          docker run --rm "${devices[@]}" -v "$PWD:/src:ro" -v "$RUNNER_TEMP/wshspace:/out" debian:trixie \
            sh /src/e2e/3dfx/space/audio-test.sh /out | tee "$RUNNER_TEMP/wshspace/run.log"
          tail -n 12 "$RUNNER_TEMP/wshspace/run.log" | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the recording and logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wshspace-audiotest
          path: ${{ runner.temp }}/wshspace
          retention-days: 14
          if-no-files-found: warn
