name: Browser SPARC

# Builds the binary files of the Browser SPARC page (docs/public/browser-sparc/, served at
# /browser-sparc/) for its four machines (docs/public/browser-sparc/machines.json: the SS-5, sun4u,
# PC and Arm virt): qemu-system-sparc, -sparc64, -x86_64 and -aarch64 for WebAssembly (wasm64, TCG
# interpreter; upstream QEMU from Debian's source package with the wsh patches), OpenBIOS and SeaBIOS
# from the published pve-qemu-kvm, wisp's kernels, Debian's xterm.js and the snapshots the page
# resumes from (web/Dockerfile; the docs guide "Browser SPARC"), then runs every machine in headless
# Chrome (mandel and the guest's clock). The result is an artifact; with `publish`, it also replaces
# the assets of the `browser-sparc` release, which repo-update.yml copies into the Pages site on its
# next deploy.
#
# By hand only: the build takes a while (Emscripten builds glib and QEMU) and its inputs change
# rarely (the wsh patches, the Debian packages, wisp).

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Replace the assets of the browser-sparc release with this build"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: '${{ github.workflow }}'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write # gh release create/upload with publish
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The machine table against the build and the page (seconds; before the long build)
      - name: Machine table tests
        run: python3 -m unittest discover -s web/tests -v

      - name: Build
        run: |
          DOCKER_BUILDKIT=1 docker build -f web/Dockerfile --target dist -o type=local,dest=web/dist .
          cat web/dist/versions.txt
          ls -l web/dist

      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-sparc
          path: web/dist/
          retention-days: 14

      # The page in headless Chrome (the runner's own), each machine from its snapshot: mandel
      # against e2e/wisp/tests/mandel.txt, and the guest's clock against the wall clock, idle and
      # with the page's thread kept busy (web/patches/slavio-timer-missed-ticks.patch). The build
      # has already run the native clock check (clock-check.py in web/Dockerfile). After the upload,
      # so that a failing build can still be looked at; before publishing, so that a failing build
      # is never published.
      - name: Check every machine in the browser
        timeout-minutes: 45
        run: |
          mkdir -p "$RUNNER_TEMP/page" "$RUNNER_TEMP/pw"
          cp docs/public/browser-sparc/* web/dist/* "$RUNNER_TEMP/page/"
          npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/pw" playwright-core@1.64.1
          cd "$RUNNER_TEMP/pw"
          CHANNEL=chrome node "$GITHUB_WORKSPACE/web/scripts/browser-check.mjs" "$RUNNER_TEMP/page" 30

      - name: Publish to the browser-sparc release
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          printf '%s\n' \
            "The binary files of the Browser SPARC page (/browser-sparc/ on the docs site), built by" \
            "\`.github/workflows/browser-sparc.yml\` from \`${SHA}\`. Pages deploys copy them next to the page." \
            "" '```' "$(cat web/dist/versions.txt)" '```' > release-notes.md
          if gh release view browser-sparc -R "$REPO" >/dev/null 2>&1; then
            gh release edit browser-sparc -R "$REPO" --notes-file release-notes.md
            gh release upload browser-sparc -R "$REPO" --clobber web/dist/*
          else
            gh release create browser-sparc -R "$REPO" --prerelease --title "Browser SPARC files" \
              --notes-file release-notes.md web/dist/*
          fi
