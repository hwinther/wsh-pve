name: wisp-test
description: >-
  Run a C program on big-endian, strict-alignment Linux (sparc32, also sparc64 and x86_64 as a
  little-endian control) in wisp, a tiny kernel booted under QEMU, and pass or fail on its exit
  status. Catches endianness and alignment bugs in seconds.

inputs:
  mode:
    description: "test or run (WISP-TEST or WISP-RUN markers)"
    required: false
    default: "test"
  network:
    description: "Use kernel-net with QEMU user networking and DHCP"
    required: false
    default: "false"
  forward:
    description: "Guest TCP port to forward to an available runner loopback port"
    required: false
    default: ""
  ready:
    description: "Console line regex to wait for before starting check"
    required: false
    default: ""
  check:
    description: "Bash command on the runner. Its status determines the result"
    required: false
    default: ""
  sources:
    description: "C files to build with the selected libc (whitespace-separated, globs allowed, relative to the working directory). Give this or binary"
    required: false
    default: ""
  binary:
    description: "A static binary for the architecture, instead of sources"
    required: false
    default: ""
  arch:
    description: "sparc32 (big-endian, SPARC V8, SS-5), sparc64 (big-endian, sun4u) or x86_64 (little-endian, pc)"
    required: false
    default: sparc32
  libc:
    description: "C library for sources: nolibc or uclibc (sparc32 and x86_64)"
    required: false
    default: nolibc
  toolchain:
    description: "Local uClibc-ng SDK tarball to use instead of downloading toolchain-url"
    required: false
    default: ""
  toolchain-url:
    description: "SDK tarball URL (defaults to wisp-toolchain-<arch>.tar.xz in the wisp-toolchain release)"
    required: false
    default: ""
  toolchain-sha256:
    description: "Expected SHA-256 of the SDK tarball"
    required: false
    default: ""
  cflags:
    description: "More compiler flags, after the default -O2 (e.g. -DFIXED -Wall -Werror)"
    required: false
    default: ""
  args:
    description: "Arguments for the program (whitespace-separated, no quoting)"
    required: false
    default: ""
  timeout:
    description: "Seconds for the whole boot, from starting QEMU to its exit"
    required: false
    default: "60"
  machine:
    description: "QEMU machine (-M) instead of the default: SS-5 for sparc32 (also SS-10, SS-20, SS-4, SPARCClassic, SPARCbook), sun4u, pc"
    required: false
    default: ""
  qemu-args:
    description: "More QEMU arguments (whitespace-separated), e.g. -m 256 or -cpu"
    required: false
    default: ""
  kit:
    description: "A wisp-test kit directory or wisp-test-kit.tar.xz to use instead of downloading kit-url"
    required: false
    default: ""
  kit-url:
    description: "Where to download the kit (kernels and nolibc headers) from"
    required: false
    default: "https://github.com/hwinther/wsh-pve/releases/download/wisp-test-kit/wisp-test-kit.tar.xz"
  kit-sha256:
    description: "The kit tarball's SHA-256; checked when set"
    required: false
    default: ""
  install:
    description: "apt-get install QEMU and the cross compiler when they are missing"
    required: false
    default: "true"

outputs:
  port:
    description: "Forwarded TCP port on the runner (WISP_PORT for check)"
    value: ${{ steps.run.outputs.port }}
  result:
    description: "pass or fail from the runner check or guest program, or error on build, boot or timeout"
    value: ${{ steps.run.outputs.result }}
  exit-code:
    description: "The program's exit code (empty when it was killed or never ran)"
    value: ${{ steps.run.outputs.exit-code }}
  signal:
    description: "The signal that killed the program, 0 if none (sparc numbers: SIGBUS is 10)"
    value: ${{ steps.run.outputs.signal }}
  signal-name:
    description: "The signal's name, e.g. SIGBUS"
    value: ${{ steps.run.outputs.signal-name }}
  seconds:
    description: "Seconds from starting QEMU to its exit"
    value: ${{ steps.run.outputs.seconds }}
  log:
    description: "Path of the console log"
    value: ${{ steps.run.outputs.log }}

runs:
  using: composite
  steps:
    - name: Run in wisp
      id: run
      shell: bash
      env:
        WISP_SOURCES: ${{ inputs.sources }}
        WISP_BINARY: ${{ inputs.binary }}
        WISP_MODE: ${{ inputs.mode }}
        WISP_NETWORK: ${{ inputs.network }}
        WISP_FORWARD: ${{ inputs.forward }}
        WISP_READY: ${{ inputs.ready }}
        WISP_CHECK: ${{ inputs.check }}
        WISP_ARCH: ${{ inputs.arch }}
        WISP_LIBC: ${{ inputs.libc }}
        WISP_TOOLCHAIN: ${{ inputs.toolchain }}
        WISP_TOOLCHAIN_URL: ${{ inputs.toolchain-url }}
        WISP_TOOLCHAIN_SHA256: ${{ inputs.toolchain-sha256 }}
        WISP_CFLAGS: ${{ inputs.cflags }}
        WISP_ARGS: ${{ inputs.args }}
        WISP_TIMEOUT: ${{ inputs.timeout }}
        WISP_MACHINE: ${{ inputs.machine }}
        WISP_QEMU_ARGS: ${{ inputs.qemu-args }}
        WISP_KIT: ${{ inputs.kit }}
        WISP_KIT_URL: ${{ inputs.kit-url }}
        WISP_KIT_SHA256: ${{ inputs.kit-sha256 }}
        WISP_INSTALL: ${{ inputs.install }}
      run: bash "$GITHUB_ACTION_PATH/wisp-test.sh"
