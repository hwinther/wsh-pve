# Retro net gateway configuration.
#
# Mount your own copy over this file, or set the same keys as environment variables
# (RETRONET_<KEY in upper case>, e.g. RETRONET_YEAR=1999); the environment wins over this file.
# Format: key = value, one per line; # starts a comment. Nothing is executed.

# The year of the web served to every guest: the Wayback Machine is asked for captures from this
# year (1997-2021). One year for the whole network.
year = 1999

# The gateway's address and prefix on the retro segment. Required. The interface that has this
# address is the retro side; every other interface is the uplink.
#address = 10.0.99.1/24

# If the retro interface comes up without an address (a Proxmox VE container with ip=manual), the
# gateway adds `address` to this interface.
#retro_interface = eth0

# The uplink's default gateway. Only needed when the runtime did not set a default route through
# the uplink (a default route through the retro side is always removed).
#uplink_gateway =

# DNS servers the gateway forwards guest queries to, space separated. Default: the servers in the
# container's /etc/resolv.conf at start (not Docker's 127.0.0.11, which cannot pass the egress filter).
#upstream_dns = 9.9.9.9 149.112.112.112

# DHCP pool on the retro segment (first,last). Default: .100 to .199 of the gateway's subnet.
#dhcp_range = 10.0.99.100,10.0.99.199
dhcp_lease = 12h
domain = retro.lan

# The archive cache (/var/lib/retronet/archive-cache) answers every Wayback lookup VintageHive makes.
# online: answer from the store, fetch from archive_upstream on a miss and keep the answer.
# offline: replay the store only; anything not in it is "not archived". Nothing leaves the gateway.
archive_mode = online
# Where misses are fetched: web.archive.org, or a VintageHive archive worker (same protocol).
archive_upstream = https://web.archive.org
# Seconds between two requests to the upstream (misses are fetched one at a time). web.archive.org
# refuses connections for a while after a burst (seen after 16 requests a second apart); the
# cache then waits a minute, doubling up to an hour, before it asks again.
archive_min_interval = 5
# Size of the store; the least recently used answers go first above it (0: no limit).
archive_max_mb = 4096

# ProtoWeb (protoweb.org's restored sites) ahead of the Wayback Machine: yes or no.
protoweb = yes

# Password for VintageHive's admin pages (http://localhost/ through the proxy, from a guest).
# Give it here, in RETRONET_ADMIN_PASSWORD, or in a file named by admin_password_file. Without one,
# a random password is generated once and kept in /var/lib/retronet/admin-password.
#admin_password_file = /run/secrets/retronet_admin_password
